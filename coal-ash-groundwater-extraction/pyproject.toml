[project]
name = "coal-ash-groundwater-extraction"
version = "0.1.0"
description = "Scanned lab reports in coal ash (CCR) groundwater reports read by two vision models, routed to review on disagreement, scored against each report's own results table"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo==0.25.1",
    "pdfplumber==0.11.10",
    "pillow==12.3.0",
    "pyarrow==26.0.1",
    "pydantic-ai-slim[openrouter]==2.55.0",
    "pypdfium2==5.14.0",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
