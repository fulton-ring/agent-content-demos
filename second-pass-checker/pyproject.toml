[project]
name = "second-pass-checker"
version = "0.1.0"
description = "Can a second AI pass catch the errors in our research agent's notes, and which ones does it miss?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo==0.25.1",
    "pandas==3.1.0",
    "pydantic-ai-slim[openrouter]==2.55.0",
    "pypdfium2==5.14.0",
    "statsmodels==0.14.5",
    "tabulate==0.9.0",
    "trafilatura==2.0.0",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
