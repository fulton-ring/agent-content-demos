[project]
name = "sp500-volume-spike-strategies"
version = "0.1.0"
description = "Backtest: after an S&P 500 stock priced $1-$20 jumps on heavy volume, does continuation, a fade, a pullback or a range break make money?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "yfinance>=1.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"*.py" = ["B018"]
