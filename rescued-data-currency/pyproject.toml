[project]
name = "rescued-data-currency"
version = "0.1.0"
description = "Re-read the newest record date in each rescued copy of 20 federal climate datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.25.2",
    "pandas>=3.0.6",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.17.1",
    "ty>=0.0.90",
    "types-requests>=2.32",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"*.py" = ["B018"]
