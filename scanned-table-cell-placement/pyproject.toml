[project]
name = "scanned-table-cell-placement"
version = "0.1.0"
description = "When AI reads an old scanned table, does each number land in the right cell, and can the printed totals check it?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo==0.25.1",
    "pandas==3.1.0",
    "rapidfuzz==3.14.3",
    "scipy==1.16.3",
    "tabulate==0.9.0",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
