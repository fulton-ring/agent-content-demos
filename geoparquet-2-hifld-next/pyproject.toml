[project]
name = "geoparquet-2-hifld-next"
version = "0.1.0"
description = "Convert HIFLD Next GeoParquet 1.1 layers to GeoParquet 2.0 native geometry and measure bytes read, size and reader support"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "duckdb==2.0.1",
    "fsspec>=2026.9.0",
    "geopandas==1.2.0",
    "geoparquet-validator==0.4.0",
    "httpx>=0.28",
    "marimo>=0.26.0",
    "pandas>=2.3",
    "polars==2.2.0",
    "pyarrow==26.0.1",
    "pyogrio==0.13.0",
    "rangehttpserver==1.4.0",
    "requests>=2.34.2",
    "shapely>=2.1",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.3",
    "ruff>=0.14",
    "ty>=0.0.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"geoparquet_2.py" = ["B018"]
