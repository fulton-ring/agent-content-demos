[project]
name = "wildfire-reach-time-map"
version = "0.1.0"
description = "Drive-time reach of fire and EMS stations over wildfire hazard, homes and people in one county"
requires-python = ">=3.12,<3.13"
dependencies = [
    "folium>=1.0.0",
    "geopandas>=1.2.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyvalhalla==3.9.1",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# A marimo cell displays its last expression, which B018 would flag.
ignore = ["B018"]
