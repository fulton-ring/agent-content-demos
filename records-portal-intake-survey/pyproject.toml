[project]
name = "records-portal-intake-survey"
version = "0.1.0"
description = "What do state public-records portals require before they accept a request, and are agencies tightening it because of AI agents?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.25.2",
    "pandas>=3.1.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "ruff>=0.17.4",
    "ty>=0.0.99",
    "types-requests>=2.33.0.20261030",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"*.py" = ["B018"]
