[project]
name = "nyc-climate-icechunk"
version = "0.1.0"
description = "Bounded real-data interoperability spike for the NYC climate hackathon"
requires-python = ">=3.12"
dependencies = [
  "marimo", "xarray", "icechunk", "zarr", "numpy", "pandas", "pyarrow",
  "requests", "matplotlib", "fsspec", "gcsfs", "pystac",
]

[dependency-groups]
dev = ["ruff", "ty", "pytest", "pandas-stubs", "types-requests"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.py" = ["B018"]
