[project]
name = "hifld-trauma-levels-audit"
version = "0.1.0"
description = "Audit of HIFLD hospitals-3 trauma levels against state designation lists, a corrected field, and its effect on distance to care"
requires-python = ">=3.12,<3.13"
dependencies = [
    "marimo>=0.9",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# A marimo cell displays its last expression, which B018 would flag.
ignore = ["B018"]
