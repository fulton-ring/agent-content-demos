[project]
name = "nyc-supply-chain-graph"
version = "0.1.0"
description = "Graph database or flat tables for the NYC supply chain risk map, and an app on top"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 1.4.4, not #62's 1.5.6: DuckPGQ has no build for DuckDB 1.5 yet.
    "duckdb==1.4.4",
    "geopandas==1.2.0",
    "ladybug==0.21.2",
    "marimo==0.25.1",
    "matplotlib==3.11.2",
    "neo4j==6.4.1",
    "networkx==3.5",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "pypdf==6.1.1",
    "requests==2.32.5",
    "shapely==2.2.0",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

[tool.ty.environment]
# The notebook imports #62's notebook to reuse its tables.
extra-paths = ["../nyc-supply-chain-risk"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# A marimo cell shows its last expression, which B018 reads as useless.
ignore = ["B018"]
