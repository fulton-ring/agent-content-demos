[project]
name = "flash-flood-warning-addresses"
version = "0.1.0"
description = "Does a terrain-only ranking of the buildings inside a flash-flood warning put the places that flooded near the top?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.0,<2.4",
    "pandas>=3.0.6",
    "pyproj>=3.8.0",
    "pysheds>=0.5",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[tool.uv]
package = false
