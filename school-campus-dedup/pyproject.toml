[project]
name = "school-campus-dedup"
version = "0.1.0"
description = "Which co-located public school records are one physical facility? Footprints, OSM campuses, imagery and a calibrated decision model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.5.6",
    "geopandas==1.2.0",
    "marimo==0.25.1",
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pillow==13.0.0",
    "pydantic==2.13.4",
    "pyproj==3.8.0",
    "pyarrow==26.0.0",
    "rapidfuzz==3.14.3",
    "scipy==1.17.1",
    "shapely==2.2.0",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# marimo shows a cell's last expression as its output, so a bare expression at the end of a cell is the point.
"[0-9]_*.py" = ["B018"]
