[project]
name = "hifld-grid-gaps"
version = "0.1.0"
description = "What the HIFLD Next power plant, generating unit and transmission line layers leave out"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.6",
    "geopandas==1.2.0",
    "marimo==0.25.1",
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pillow==13.0.0",
    "pyarrow==26.0.0",
    "shapely==2.2.0",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
