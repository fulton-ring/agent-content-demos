[project]
name = "child-care-facilities-rebuild"
version = "0.1.0"
description = "Can a national child care facilities layer be rebuilt from state rosters, OSM and Overture?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.6",
    "geopandas==1.2.0",
    "marimo==0.25.1",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "rapidfuzz==3.14.3",
    "requests==2.32.5",
    "shapely==2.2.0",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# marimo shows a cell's last bare expression as its output.
"child_care.py" = ["B018"]
