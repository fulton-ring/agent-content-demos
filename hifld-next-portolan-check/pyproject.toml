[project]
name = "hifld-next-portolan-check"
version = "0.1.0"
description = "Does HIFLD Next pass Portolan's checks, and is tylertoo faster than tippecanoe on its tiles?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "mapbox-vector-tile>=2.2.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "portolan-cli==0.9.0",
    "rashid==0.3.0",
    "tylertoo==0.8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"*.py" = ["B018"]
