[project]
name = "hifld-mcp-citations"
version = "0.1.0"
description = "Can an agent answer from HIFLD Next be cited to a dataset version and reproduced?"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "marimo>=0.25.1",
    "polars>=2.0.0",
    "pydantic-ai-slim[mcp,openrouter]>=2.57.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# A bare expression at the end of a marimo cell is what the cell displays, and marimo
# generates cell functions without annotations.
ignore = ["B018", "ANN"]
