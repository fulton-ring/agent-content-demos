[project]
name = "policy-builder"
version = "0.1.0"
description = "Draft a one-page nonprofit AI use policy from call notes"
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "nltk>=3.10.3",
    "playwright>=1.64.0",
    "pydantic-ai-slim[openai]>=2.56.0",
    "pypdf>=6.20.1",
    "textstat==0.7.13",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.88",
]

[project.scripts]
build-policies = "policy_builder.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
