[project]
name = "usgs-provisional-peak-revisions"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "altair>=6.3.0",
    "httpx>=0.28.1",
    "marimo>=0.25.2",
    "polars>=2.1.0",
    "vl-convert-python>=1.9.0.post1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "ty>=0.0.101",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"*.py" = ["B018"]
