[project]
name = "overpass-modern-stack"
version = "0.1.0"
description = "Can osm2pgsql + PostGIS answer the Overpass queries people send, and stay fresh?"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "marimo>=0.10",
    "polars>=1.20",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = ["ruff>=0.9", "ty>=0.0.1a1"]
