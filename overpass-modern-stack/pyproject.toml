[project]
name = "overpass-modern-stack"
version = "0.1.0"
description = "Can osm2pgsql + PostGIS answer the Overpass queries people send, and stay fresh?"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "marimo>=0.10",
    "polars>=1.20",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "uvicorn>=0.34",
    "duckdb>=1.4,<1.5",
    "quackosm>=0.19.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9",
    "ty>=0.0.1a1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays, and
# the notebook's markdown tables can't wrap.
"benchmark.py" = ["B018", "E501"]
"ql_compiler.py" = ["B018", "E501"]
# Overpass QL queries read best on one line each.
"answer_key.py" = ["E501"]

[tool.ruff.format]
skip-magic-trailing-comma = true
