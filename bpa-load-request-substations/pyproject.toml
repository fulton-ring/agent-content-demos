[project]
name = "bpa-load-request-substations"
version = "0.1.0"
description = "How many substations named in BPA's large-load interconnection requests can HIFLD Next and us-substations-verified find?"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "geopandas>=1.2.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "pyogrio>=0.13.0",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"substations.py" = ["B018"]
