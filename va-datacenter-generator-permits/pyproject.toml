[project]
name = "va-datacenter-generator-permits"
version = "0.1.0"
description = "Can a vision model rebuild Virginia's data-center generator dataset from DEQ air permits?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo==0.25.1",
    "pandas==3.1.0",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
