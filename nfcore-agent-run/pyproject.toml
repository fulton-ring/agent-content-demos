[project]
name = "nfcore-agent-run"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.25.2",
    "pandas>=3.1.1",
    "pydantic-ai-slim[openrouter]>=2.66.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays, and marimo
# generates cell functions without annotations.
"notebook.py" = ["B018", "ANN"]
