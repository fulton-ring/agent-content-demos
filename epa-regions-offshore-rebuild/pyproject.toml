[project]
name = "epa-regions-offshore-rebuild"
version = "0.1.0"
description = "Rebuild EPA regions with offshore waters from EPA 2023 regions and NOAA maritime limits"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.2.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "pyarrow>=26.0.1",
    "pyogrio>=0.13.0",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "ruff>=0.17.5",
    "ty>=0.0.106",
    "types-requests>=2.33.0.20261030",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays; marimo cells end in `return`.
"*.py" = ["B018"]
