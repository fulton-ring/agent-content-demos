[project]
name = "govtext-pdf-only-facts"
version = "0.1.0"
description = "Which infrastructure facts exist only in the federal PDFs archived in 2020?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "marimo>=0.25.2",
    "pandas>=3.1.1",
    "pyahocorasick>=2.3.1",
    "pydantic-ai-slim[openai]>=2.66.0",
    "pymupdf>=2.1",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"*.py" = ["B018"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "ruff>=0.17.4",
    "ty>=0.0.99",
    "types-requests>=2.33.0.20261030",
]
