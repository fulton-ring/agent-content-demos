[project]
name = "pjm-large-load-withdrawals"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.2.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "pyarrow>=26.0.1",
    "pydantic-ai-slim[openai]>=2.68.0",
    "pyogrio>=0.13.0",
    "pypdfium2>=5.15.2",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "ruff>=0.17.5",
    "ty>=0.0.101",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"withdrawals.py" = ["B018"]
