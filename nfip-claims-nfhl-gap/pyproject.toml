[project]
name = "nfip-claims-nfhl-gap"
version = "0.1.0"
description = "How many NFIP claims can FEMA's NFHL place once the Community Layer is gone?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "marimo>=0.25.2",
    "pandas>=3.0.6",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.17.1",
    "ty>=0.0.90",
    "types-requests>=2.32",
    "types-shapely>=2.1.0.20261030",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"*.py" = ["B018"]
