[project]
name = "nightlight-storm-restoration"
version = "0.1.0"
description = "Can satellite night light check a utility's storm restoration report?"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pypdf>=7.0.1",
    "rasterio>=1.5.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays, and marimo
# writes an explicit return at the end of every cell.
"*.py" = ["B018", "PLR1711"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.100",
]
