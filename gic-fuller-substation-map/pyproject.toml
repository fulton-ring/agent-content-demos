[project]
name = "gic-fuller-substation-map"
version = "0.1.0"
description = "Rerun the open C-SWIM geomagnetic storm model on HIFLD Next lines and our verified substations"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bezpy==0.1.1",
    "duckdb>=2.0.0",
    "geopandas>=1.2.0",
    "h5py>=3.16.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "powerlaw>=2.0.0",
    "pyarrow>=26.0.1",
    "pyogrio>=0.13.0",
    "pysecs>=0.4.0",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "setuptools<81",
    "shapely>=2.2.0",
    "xarray>=2026.9.0",
    "zstandard>=0.25.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "ruff>=0.17.4",
    "scipy-stubs>=1.17.1.5",
    "ty>=0.0.99",
]
