[project]
name = "reducto-open-pipeline"
version = "0.1.0"
description = "Can Docling plus a vision language model do Reducto's parse and extract? Schema extraction and section parsing, measured"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling==2.138.0",
    "marimo==0.25.1",
    "pydantic-ai-slim[openrouter]==2.55.0",
    "pypdfium2==5.14.0",
    "rapidfuzz==3.14.3",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

# Docling's layout model needs PyTorch; the CPU build keeps the environment small (the default pulls in CUDA).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
