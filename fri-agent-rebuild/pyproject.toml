[project]
name = "fri-agent-rebuild"
version = "0.1.0"
description = "Rebuild FEMA's Future Risk Index hazard multipliers from public climate data with an autoresearch-style agent loop"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "fsspec>=2024.6",
    "geopandas>=1.0",
    "h5py>=3.11",
    "marimo>=0.25.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic-ai-slim[openai]>=1.0",
    "pyogrio>=0.10",
    "rasterio>=1.4",
    "requests>=2.32",
    "scipy>=1.14",
    "shapely>=2.0",
]

[project.scripts]
fri-swarm = "fri_rebuild.swarm:main"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.7",
    "scipy-stubs>=1.17.1.5",
    "ty>=0.0.1a20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fri_rebuild"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays, and marimo
# generates cell functions without annotations.
"notebooks/*" = ["B018", "ANN"]
