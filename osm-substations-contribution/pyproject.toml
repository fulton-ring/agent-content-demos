[project]
name = "osm-substations-contribution"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.2.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"contribution.py" = ["B018"]
