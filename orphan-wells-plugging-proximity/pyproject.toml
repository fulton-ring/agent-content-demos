[project]
name = "orphan-wells-plugging-proximity"
version = "0.1.0"
description = "Are IIJA-plugged orphaned wells closer to hospitals and schools than the wells still waiting?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.0",
    "marimo>=0.9",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "us>=4.0.0",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# A marimo cell displays its last expression, which B018 would flag.
ignore = ["B018"]
