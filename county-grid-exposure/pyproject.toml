[project]
name = "county-grid-exposure"
version = "0.1.0"
description = "County grid-exposure index: high-voltage substations by US county and hazard, counts only, with a suppression rule"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.6",
    "geopandas>=1.2.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyogrio>=0.13.0",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.17.1",
    "scipy-stubs>=1.17.1.5",
    "ty>=0.0.90",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"grid_exposure.py" = ["B018"]
