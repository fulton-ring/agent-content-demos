[project]
name = "facility-climate-ranking"
version = "0.1.0"
description = "Rank HIFLD Next facilities by climate risk with FEMA's National Risk Index and our Future Risk Index rebuild"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyogrio>=0.13.0",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"notebook.py" = ["B018"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]
