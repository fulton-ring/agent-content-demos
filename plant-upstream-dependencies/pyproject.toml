[project]
name = "plant-upstream-dependencies"
version = "0.1.0"
description = "How many US power plants have a recorded upstream dependency in public data?"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "marimo>=0.25.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "rapidfuzz>=3.14.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# A bare expression at the end of a marimo cell is what the cell displays, and marimo
# generates cell functions without annotations.
ignore = ["B018", "ANN"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "ty>=0.0.104",
]
