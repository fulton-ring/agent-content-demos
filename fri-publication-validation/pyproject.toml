[project]
name = "fri-publication-validation"
version = "0.1.0"
description = "Independent validation of archived FRI downstream fields and county–tract publication readiness"
requires-python = ">=3.12"
dependencies = ["marimo", "numpy", "pandas", "openpyxl", "matplotlib", "requests", "scipy", "scikit-learn", "pyarrow"]

[dependency-groups]
dev = ["ruff", "ty", "pandas-stubs", "scipy-stubs", "types-requests", "pytest"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebook.py" = ["B018"]
