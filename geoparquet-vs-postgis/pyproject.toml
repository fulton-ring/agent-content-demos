[project]
name = "geoparquet-vs-postgis"
version = "0.1.0"
description = "Time spatial queries on HIFLD Next GeoParquet read by DuckDB from object storage against the same data in PostGIS"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40",
    "duckdb>=2.0.0",
    "geoparquet-io==0.4.0",
    "marimo>=0.25.2",
    "matplotlib>=3.10",
    "pandas>=2.3",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.3",
    "ruff>=0.14",
    "ty>=0.0.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"benchmark.py" = ["B018"]
