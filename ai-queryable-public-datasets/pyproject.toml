[project]
name = "ai-queryable-public-datasets"
version = "0.1.0"
description = "Which free public datasets can DuckDB and an AI agent query in place today?"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.0",
    "httpx>=0.28.1",
    "marimo>=0.25.1",
    "polars>=1.0.0",
    "pyarrow>=18.0.0",
    "pydantic-ai-slim[mcp,openrouter]>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "ty>=0.0.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# A bare expression at the end of a marimo cell is what the cell displays, and marimo
# generates cell functions without annotations.
ignore = ["B018", "ANN"]
