[project]
name = "hifld-transmission-form1-costs"
version = "0.1.0"
description = "How many HIFLD transmission lines can be tied to FERC Form 1 cost records"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas==1.2.0",
    "marimo==0.25.1",
    "matplotlib==3.11.2",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "shapely==2.2.0",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
