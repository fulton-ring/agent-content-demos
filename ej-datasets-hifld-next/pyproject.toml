[project]
name = "ej-datasets-hifld-next"
version = "0.1.0"
description = "Rebuild EJScreen, EJAM and CEJST as versioned GeoParquet with STAC metadata for HIFLD Next"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "fsspec>=2026.9.0",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pyogrio>=0.13.0",
    "pystac[validation]>=1.15.2",
    "rdata>=1.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# A bare expression at the end of a marimo cell is what the cell displays, and marimo
# generates cell functions without annotations.
ignore = ["B018", "ANN"]
