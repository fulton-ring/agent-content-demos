[project]
name = "trauma-burn-center-access"
version = "0.1.0"
description = "Travel time from every US block group to trauma and burn centers, by income, race, rurality and EJ burden"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.0",
    "marimo>=0.9",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyvalhalla==3.9.1",
    "rapidfuzz>=3.9",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# A marimo cell displays its last expression, which B018 would flag.
ignore = ["B018"]
