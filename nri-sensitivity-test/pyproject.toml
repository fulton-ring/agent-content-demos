[project]
name = "nri-sensitivity-test"
version = "0.1.0"
description = "The sensitivity test FEMA didn't run: swap the National Risk Index's social vulnerability input back and measure the change"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.25.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.17.1",
    "scipy-stubs>=1.18.1.1",
    "ty>=0.0.89",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"notebook.py" = ["B018"]
