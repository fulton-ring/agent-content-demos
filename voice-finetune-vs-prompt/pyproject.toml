[project]
name = "voice-finetune-vs-prompt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "marimo>=0.25.2",
    "pydantic-ai-slim[openrouter]>=2.66.0",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
