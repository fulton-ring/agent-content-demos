[project]
name = "k1-extraction-review-queue"
version = "0.1.0"
description = "K-1 and brokerage 1099 extraction with a review queue, comparing vision and OCR models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling==2.138.0",
    "marimo==0.25.1",
    "modal[api-proxy-support]==1.6.1",
    "numpy==2.2.6",
    "pdfplumber==0.11.10",
    "pillow==12.3.0",
    "playwright==1.63.0",
    "pydantic-ai-slim[openrouter]==2.55.0",
    "pypdf==6.1.1",
    "pypdfium2==5.14.0",
    "reportlab==5.0.1",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

# Docling's layout model needs PyTorch; the CPU build keeps the environment small (the default pulls in CUDA).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
