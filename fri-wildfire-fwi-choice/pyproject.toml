[project]
name = "fri-wildfire-fwi-choice"
version = "0.1.0"
description = "Which NEX FWI ensemble and statistic reproduce FEMA's Future Risk Index wildfire multipliers"
requires-python = ">=3.11"
dependencies = [
    "fri-agent-rebuild",
    "marimo>=0.25.1",
    "numpy>=2.0",
    "pandas>=2.2",
]

[tool.uv.sources]
fri-agent-rebuild = { path = "../fri-agent-rebuild" }

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.7",
    "ty>=0.0.1a20",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["B018", "ANN"]
