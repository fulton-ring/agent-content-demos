[project]
name = "open-flood-layer-vs-nfhl"
version = "0.1.0"
description = "Does an open flood layer rank Harris County block groups by Hurricane Harvey flood damage better than FEMA's SFHA?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "fsspec>=2026.9.0",
    "geopandas>=1.2.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pyogrio>=0.13.0",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "whitebox-workflows>=2.0.6",
    "xarray>=2026.9.0",
    "zarr>=3.4.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"notebook.py" = ["B018"]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "ty>=0.0.91",
]
