[project]
name = "fema-nrc-extraction-accuracy"
version = "0.1.0"
description = "How accurate is AI document extraction on long FEMA flood studies and old scanned NRC records?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo==0.25.1",
    "pandas==3.1.0",
    "pillow==12.3.0",
    "pydantic-ai-slim[openrouter]==2.55.0",
    "pypdfium2==5.14.0",
    "pytesseract==0.3.13",
    "rank-bm25==0.2.2",
    "rapidfuzz==3.14.3",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
