[project]
name = "nyc-supply-chain-risk"
version = "0.1.0"
description = "FEMA's supply chain resilience method applied to NYC's public power data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.6",
    "geopandas==1.2.0",
    "marimo==0.25.1",
    "matplotlib==3.11.2",
    "networkx==3.5",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "pypdf==6.1.1",
    "requests==2.32.5",
    "shapely==2.2.0",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# A marimo cell shows its last expression, which B018 reads as useless.
ignore = ["B018"]
