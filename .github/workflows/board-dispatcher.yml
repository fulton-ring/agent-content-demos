name: Board dispatcher

# Starts a Claude Research worker on each Ready card on the Agent work board.
# Rules for the board live on the Agent Content page in Notion.

on:
  schedule:
    - cron: "*/15 * * * *"
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list the cards that would get a worker"
        type: boolean
        default: true

concurrency:
  group: board-dispatcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    # Runs on schedule, by hand, and right away when an agent adds a move:* label.
    if: github.event_name != 'issues' || startsWith(github.event.label.name, 'move:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/board-dispatcher
    env:
      GH_TOKEN: ${{ secrets.AGENT_BOARD_TOKEN }}
      SPIKE_WORKER_TOKEN: ${{ secrets.SPIKE_WORKER_TOKEN }}
      WORKER_ROUTINE_ID: trig_01QFJTcXruuR1BDyYQMK7kgU
      PROJECT_OWNER: fulton-ring
      PROJECT_NUMBER: "1"
      REPO: ${{ github.repository }}
      # A safety ceiling, not a throttle: the Research manager's open-issue limit sets the pace.
      MAX_IN_PROGRESS: "30"
      COOLDOWN_HOURS: "6"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
    steps:
      - name: Skip until the secrets are set
        if: env.GH_TOKEN == '' || env.SPIKE_WORKER_TOKEN == ''
        run: echo "AGENT_BOARD_TOKEN or SPIKE_WORKER_TOKEN isn't set; nothing to do."
      - uses: actions/checkout@v4
        if: env.GH_TOKEN != '' && env.SPIKE_WORKER_TOKEN != ''
      - uses: astral-sh/setup-uv@v5
        if: env.GH_TOKEN != '' && env.SPIKE_WORKER_TOKEN != ''
      - run: uv run --frozen --no-dev board-dispatcher
        if: env.GH_TOKEN != '' && env.SPIKE_WORKER_TOKEN != ''
