[project]
name = "epa-archive-datasets"
version = "0.1.0"
description = "Inventory the data files in the archive.epa.gov preservation crawl and extract a few to Parquet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "access-parser>=0.0.6",
    "marimo>=0.25.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-calamine>=0.9.1",
    "requests>=2.34.2",
    "warcio>=1.8.2",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "ruff>=0.17.4",
    "ty>=0.0.99",
    "types-requests>=2.33.0.20261030",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"*.py" = ["B018"]
