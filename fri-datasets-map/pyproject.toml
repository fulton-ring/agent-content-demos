[project]
name = "fri-datasets-map"
version = "0.1.0"
description = "County datasets and an embeddable map from the Future Risk Index rebuilds"
requires-python = ">=3.12"
dependencies = [
    # The rebuild's own answer-key loader and scorer, so baselines are scored the same way.
    "fri-agent-rebuild",
    "geopandas>=1.0",
    "marimo>=0.25.1",
    "pandas>=2.2",
    "pyarrow>=17",
]

[tool.uv.sources]
fri-agent-rebuild = { path = "../fri-agent-rebuild" }

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays, and marimo
# generates cell functions without annotations.
"datasets.py" = ["B018", "ANN"]
