<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embed example</title>
    <style>
      body { max-width: 760px; margin: 2rem auto; font-family: Georgia, serif; }
    </style>
  </head>
  <body>
    <article>
      <h1>What's inside FEMA's frozen climate risk multipliers</h1>
      <p>Article text before the map.</p>
      <!-- The embed: these two lines go in the Astro page. Pin the commit, not a branch. -->
      <div data-fri-map data-hazard="HRCN" style="--fri-map-height: 480px"></div>
      <script type="module" src="https://cdn.jsdelivr.net/gh/fulton-ring/agent-content-demos@COMMIT/fri-datasets-map/map/dist/fri-map.js"></script>
      <p>Article text after the map.</p>
    </article>
  </body>
</html>
