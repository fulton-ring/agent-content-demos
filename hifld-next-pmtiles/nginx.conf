# Three local stand-ins, started by the notebook. @ROOT@ and @RUN@ are filled in at run time.
#   :8081  "bucket": plain object storage. Static files with ETag, Range support, CORS, and the same
#          Cache-Control HIFLD Next's bucket sends today (public, max-age=3600).
#   :8082  "CDN, whole-object cache": fetches the whole file once and serves ranges from its copy,
#          the way Cloudflare caches objects.
#   :8083  "CDN, range-slice cache": caches the file in 128 kB slices fetched as needed, the way
#          CloudFront and Fastly cache large objects requested by range (their slices are MBs;
#          ours are scaled down to match the 2 MB test file).
worker_processes 1;
daemon off;
pid @RUN@/nginx.pid;
error_log @RUN@/nginx-error.log warn;

events { worker_connections 256; }

http {
    types {
        text/html html;
        application/json json;
        application/octet-stream pmtiles;
    }
    access_log off;
    client_body_temp_path @RUN@/tmp;
    proxy_temp_path @RUN@/tmp;
    proxy_cache_path @RUN@/cache-whole keys_zone=whole:10m;
    proxy_cache_path @RUN@/cache-slice keys_zone=slice:10m;

    server {
        listen 127.0.0.1:8081;
        root @ROOT@;
        etag on;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "ETag, Content-Range, Content-Length" always;
        location ~ \.(json|html)$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache" always;
        }
        location / {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "ETag, Content-Range, Content-Length" always;
            add_header Cache-Control "public, max-age=3600" always;
        }
    }

    server {
        listen 127.0.0.1:8082;
        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_cache whole;
            add_header X-Cache $upstream_cache_status always;
        }
    }

    server {
        listen 127.0.0.1:8083;
        location / {
            slice 128k;
            proxy_pass http://127.0.0.1:8081;
            proxy_cache slice;
            proxy_cache_key $uri$slice_range;
            proxy_set_header Range $slice_range;
            proxy_cache_valid 200 206 60m;
            add_header X-Cache $upstream_cache_status always;
        }
    }
}
