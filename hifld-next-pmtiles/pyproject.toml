[project]
name = "hifld-next-pmtiles"
version = "0.1.0"
description = "Publish HIFLD Next layers as single PMTiles files, map them with no tile server, and test the update path"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "marimo>=0.25.2",
    "pandas>=3.1.1",
    "playwright>=1.65.0",
    "pmtiles>=3.8.1",
    "pyarrow>=26.0.1",
    "pyogrio>=0.13.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.100",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# A bare expression at the end of a marimo cell is what the cell displays, and marimo
# generates cell functions without annotations.
ignore = ["B018", "ANN"]
