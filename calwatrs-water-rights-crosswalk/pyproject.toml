[project]
name = "calwatrs-water-rights-crosswalk"
version = "0.1.0"
description = "Archive California's eWRIMS water rights list and measure what CalWATRS keeps, above all the holder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gdown>=6.5.1",
    "geopandas>=1.2.0",
    "marimo>=0.25.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "ruff>=0.17.5",
    "ty>=0.0.104",
    "types-requests>=2.33.0.20261030",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"*.py" = ["B018"]

[tool.ty.environment]
# The WaDE spike's helpers, imported by crosswalk.py without editing that folder.
extra-paths = ["../wade-water-rights-rebuild"]
