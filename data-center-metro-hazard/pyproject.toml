[project]
name = "data-center-metro-hazard"
version = "0.1.0"
description = "Do data centers in the same metro share the same FEMA flood zones and National Risk Index scores?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyogrio>=0.13.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"notebook.py" = ["B018"]
