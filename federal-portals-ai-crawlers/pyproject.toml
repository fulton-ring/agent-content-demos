[project]
name = "federal-portals-ai-crawlers"
version = "0.1.0"
description = "Which federal data portals turn away AI crawlers and agents, and which datasets does that hide?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.25.2",
    "pandas>=3.1.1",
    "protego>=0.7.0",
    "pydantic>=2.14.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "ruff>=0.17.4",
    "ty>=0.0.99",
    "types-requests>=2.33.0.20261030",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"*.py" = ["B018"]
