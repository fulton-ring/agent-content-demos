name: federal-portals-ai-crawlers second network

# Runs part 1 of the spike (crawl.py) from a GitHub Actions runner, the second network the spike compares, and
# commits its results to the spike branch. Kept in the project folder; copied to .github/workflows only while the
# spike branch needs the run, never merged.

on:
  push:
    branches: [spike/federal-portals-ai-crawlers]
    paths: [federal-portals-ai-crawlers/crawl.py, federal-portals-ai-crawlers/hosts.csv]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: federal-portals-ai-crawlers
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Show the runner's public address owner
        run: curl -sS https://api.ipify.org?format=json && echo
      - run: uv run --frozen crawl.py
        env:
          NETWORK: github-actions
      - name: Print results
        run: cat results/robots-github-actions.csv results/live-github-actions.csv
      - name: Commit results to the spike branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/robots-github-actions.csv results/live-github-actions.csv
          git commit -m "federal-portals-ai-crawlers: crawl from GitHub Actions" || exit 0
          git pull --rebase origin spike/federal-portals-ai-crawlers
          git push origin HEAD:spike/federal-portals-ai-crawlers
