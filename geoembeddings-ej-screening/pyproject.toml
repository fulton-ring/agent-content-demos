[project]
name = "geoembeddings-ej-screening"
version = "0.1.0"
description = "Can AlphaEarth satellite embeddings find high-burden communities the EJ indexes miss?"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pyogrio>=0.13.0",
    "rasterio>=1.5.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.93",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# A bare expression at the end of a marimo cell is what the cell displays, and marimo
# generates cell functions without annotations.
ignore = ["B018", "ANN"]
