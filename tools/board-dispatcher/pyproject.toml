[project]
name = "board-dispatcher"
version = "0.1.0"
description = "Starts a Claude Research worker for each Ready card on the Agent work board."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
board-dispatcher = "board_dispatcher.main:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "ty>=0.0.1a1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "PL", "ANN", "S", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
