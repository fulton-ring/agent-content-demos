[project]
name = "prison-boundaries-rebuild"
version = "0.1.0"
description = "Can a national prison boundaries layer be rebuilt from BOP, state DOC lists, OSM and Overture?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.0",
    "geopandas>=1.2.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "pyarrow>=26.0.1",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "ty>=0.0.106",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
