[project]
name = "parcel-platform-layers"
version = "0.1.0"
description = "Which layers of a commercial parcel platform (Regrid, Mireye) can be rebuilt from public sources, tested in three counties"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.6",
    "marimo==0.25.1",
    "matplotlib==3.11.2",
    "pandas==3.0.6",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "ty==0.0.89",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
