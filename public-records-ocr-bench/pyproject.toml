[project]
name = "public-records-ocr-bench"
version = "0.1.0"
description = "Can the answer keys from our FEMA and NRC extraction test become an open OCR benchmark for US public records?"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "marimo==0.25.1",
    "olmocr[bench]==0.4.27",
    "pandas==3.1.0",
    "pillow==12.3.0",
    "pydantic-ai-slim[openrouter]==2.55.0",
    "pypdfium2==5.14.0",
    "pytesseract==0.3.13",
    "tabulate==0.9.0",
]

[dependency-groups]
dev = ["ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
