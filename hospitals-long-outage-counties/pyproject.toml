[project]
name = "hospitals-long-outage-counties"
version = "0.1.0"
description = "Which US hospitals sat in the counties that stayed dark longest after major storms?"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-ai-slim[mcp,openrouter]>=2.68.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# A bare expression at the end of a marimo cell is what the cell displays.
ignore = ["B018"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "ty>=0.0.101",
]
