[project]
name = "county-bans-substations"
version = "0.1.0"
description = "Do US counties with renewable energy restrictions hold or border high-voltage substations? Sabin Center restrictions joined to HIFLD Next transmission lines"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.2.0",
    "marimo>=0.25.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyogrio>=0.13.0",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.17.1",
    "scipy-stubs>=1.17.1.5",
    "ty>=0.0.89",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is what the cell displays.
"analysis.py" = ["B018"]
